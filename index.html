<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tugas Kuliahku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <p class="date" id="tanggal"></p>
    <h1>Halo, <span id="nama" contenteditable="true" spellcheck="false" title="Klik untuk ubah nama">Mahasiswa</span> 🎀</h1>
    <p class="sub">Semua tugas kuliahmu, rapi di satu tempat.</p>
    <div class="progress"><div id="bar"></div></div>
    <p class="pct" id="pct">0% tugas selesai</p>
  </div>
</header>

<main class="wrap">
  <section class="stats" aria-label="Ringkasan">
    <div class="stat"><b id="sTotal">0</b><span>Total tugas</span></div>
    <div class="stat"><b id="sTodo">0</b><span>Belum selesai</span></div>
    <div class="stat"><b id="sDone">0</b><span>Sudah dikumpul</span></div>
    <div class="stat warn"><b id="sLate">0</b><span>Terlambat</span></div>
  </section>

  <section class="next" id="next" hidden></section>

  <section class="card">
    <h2>Tambah tugas baru</h2>
    <form id="form">
      <label>Mata kuliah<input id="mk" required placeholder="Contoh: Basis Data"></label>
      <label>Judul tugas<input id="judul" required placeholder="Contoh: Laporan ERD"></label>
      <label>Deadline<input id="deadline" type="datetime-local" required></label>
      <label>Prioritas
        <select id="prioritas"><option>Rendah</option><option selected>Sedang</option><option>Tinggi</option></select>
      </label>
      <label class="full">Link pengumpulan (opsional)<input id="link" type="url" placeholder="https://..."></label>
      <label class="full">Catatan (opsional)<textarea id="catatan" rows="2" placeholder="Format file, dosen, dll."></textarea></label>
      <button class="btn full" type="submit">Simpan tugas</button>
    </form>
  </section>

  <section class="card">
    <div class="listhead">
      <h2>Daftar tugas</h2>
      <div class="filters">
        <input id="cari" type="search" placeholder="Cari tugas atau mata kuliah">
        <select id="fStatus">
          <option value="semua">Semua</option>
          <option value="todo">Belum selesai</option>
          <option value="done">Selesai</option>
          <option value="late">Terlambat</option>
        </select>
        <select id="fUrut">
          <option value="deadline">Urut deadline</option>
          <option value="prioritas">Urut prioritas</option>
          <option value="baru">Terbaru ditambah</option>
        </select>
      </div>
    </div>
    <ul id="list" class="list"></ul>
    <p class="empty" id="empty" hidden>Belum ada tugas di sini. Tambahkan lewat formulir di atas.</p>
  </section>
</main>

<footer class="wrap foot">Data tersimpan di browser kamu. <button class="link" id="hapusSemua">Hapus semua data</button></footer>
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
